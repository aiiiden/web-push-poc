<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>web-push-poc</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 480px;
        margin: 0 auto;
        padding: 16px;
        line-height: 1.5;
      }
      button {
        display: block;
        width: 100%;
        height: 44px;
        margin-top: 8px;
        font-size: 16px;
      }
      dl {
        display: grid;
        grid-template-columns: auto 1fr;
        gap: 4px 12px;
      }
      dt {
        font-weight: bold;
      }
      dd {
        margin: 0;
        word-break: break-all;
      }
      .note {
        margin: 2px 0 0;
        font-size: 13px;
        color: #555;
      }
      pre {
        padding: 8px;
        background: #f0f0f0;
        white-space: pre-wrap;
        word-break: break-all;
        min-height: 120px;
      }
    </style>
  </head>
  <body>
    <h1>web-push-poc</h1>

    <dl>
      <dt>푸시 지원</dt>
      <dd id="support">확인 중</dd>
      <dt>알림 권한</dt>
      <dd id="permission">확인 중</dd>
      <dt>여는 방식</dt>
      <dd id="display">확인 중</dd>
      <dt>구독</dt>
      <dd id="subscription">확인 중</dd>
    </dl>

    <button id="subscribe">구독</button>
    <button id="unsubscribe">구독 취소</button>

    <h2>테스트 알림</h2>
    <label><input type="checkbox" id="delay" /> 10초 뒤에 보내기 (앱을 닫거나 화면을 끄고 받아 보기)</label>
    <div id="presets"></div>

    <h2>기록</h2>
    <pre id="log"></pre>

    <script type="module" src="/app.js"></script>
  </body>
</html>
